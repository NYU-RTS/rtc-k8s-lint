name: Example Workflow

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test the Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Run the Container Action
        id: run
        uses: NYU-RTS/rtc-k8s-lint@v0.7.0
        with:
          location: "/github/workspace/example"

      - name: Print Manifest
        id: print-manifest
        run: echo "${{ steps.run.outputs.manifest }}"

      - name: Print Validation Result
        id: print-valitaion-result
        run: echo "${{ steps.run.outputs.validation-json }}"
