name: Example Workflow

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test the Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the Container Action
        id: run
        uses: ./
        with:
          location: "example"
          kustomize: true

      - name: Print Manifest
        id: print-manifest
        run: echo "${{ steps.run.outputs.manifest }}"

      - name: Print Validation Result
        id: print-valitaion-result
        run: echo "${{ steps.run.outputs.validation-json }}"
