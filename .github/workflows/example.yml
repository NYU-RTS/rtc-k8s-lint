name: Example Workflow

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test the Action
    runs-on: ubuntu-latest

    steps:
      - name: Wait for CD workflow to tag a new release
        id: wait
        run: sleep 15m
      - name: Run the Container Action
        id: run
        uses: NYU-RTS/rtc-k8s-lint@v0.4.0
        with:
          location: "/github/workspace/example"

      - name: Print Output
        id: output
        run: echo "${{ steps.run.outputs.manifest }}"
