---
name: lint-yaml

"on":
  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: write


jobs:
  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: yamllint
        uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060  # v1.25.2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review  # Change reporter.
