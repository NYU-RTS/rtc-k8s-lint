name: lint-yaml

on:
  pull_request:
    branches:
      - main

 
permissions:
  contents: read
  pull-requests: write 


jobs:
  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        uses: reviewdog/action-yamllint@de68272fdca5f2a961fb309e0d2e13c2eb186d9e #v1.23.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review # Change reporter.
