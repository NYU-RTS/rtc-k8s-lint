---
name: lint-yaml

"on":
  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: write


jobs:
  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: yamllint
        uses: reviewdog/action-yamllint@5dd4640db975e4cac6f4e775a401695bafc28068  # v1.25.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review  # Change reporter.
