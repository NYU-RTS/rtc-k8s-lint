name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Container Image
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-prebuilt-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Run the Container
        id: run
        env:
          INPUT_LOCATION: "example"
          INPUT_KUSTOMIZE: "true"
          GITHUB_OUTPUT: "/tmp/output"
        run: |
          docker run \
            -v ${{ github.workspace }}:/github/workspace:rw \
            --env INPUT_LOCATION="${{ env.INPUT_LOCATION }}" \
            --env INPUT_KUSTOMIZE="${{ env.INPUT_KUSTOMIZE }}" \
            --env GITHUB_OUTPUT="${{ env.GITHUB_OUTPUT }}" \
            --rm ${{ env.TEST_TAG }}
