name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Container Image
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-prebuilt-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Run the Container
        id: run
        env:
          INPUT_LOCATION: "/src/example"
          GITHUB_OUTPUT: "/tmp/output"
        run: |
          docker run \
            -v ${{ github.workspace }}:/src:rw \
            --env INPUT_LOCATION="${{ env.INPUT_LOCATION }}" \
            --env GITHUB_OUTPUT="${{ env.GITHUB_OUTPUT }}" \
            --rm ${{ env.TEST_TAG }}
