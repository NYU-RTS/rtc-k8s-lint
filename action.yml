---
name: RTC Kubernetes Lint
description: |
  Render K8s manifests with Kustomize and validate them with Flux schema.
author: NYU RTS

# Define your inputs here.
inputs:
  location:
    description: Path to the Kustomize root, relative to the repository root
    required: true
  github-token:
    description: >-
      Token used to authenticate git operations for private remote Kustomize
      bases via the GitHub CLI credential helper. Defaults to the workflow's
      GITHUB_TOKEN; pass a fine-grained PAT or GitHub App token if private
      remote bases on github.com live outside the current repo's access.
    required: false
    default: ${{ github.token }}

# Define your outputs here.
outputs:
  manifest:
    description: The rendered manifest produced by Kustomize
    value: ${{ steps.lint.outputs.manifest }}
  validation-json:
    description: The Flux schema validation result in JSON format
    value: ${{ steps.lint.outputs['validation-json'] }}

# Update the image repository and tag below.
runs:
  using: "composite"
  steps:
    - name: lint
      id: lint
      uses: docker://ghcr.io/nyu-rts/rtc-k8s-lint:v0.21.0
      env:
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - name: Refresh PR validation comment
      if: >-
        github.event_name == 'pull_request' ||
        github.event_name == 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        MANIFEST_PATH: ${{ inputs.location }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        VALIDATION_JSON: ${{ steps.lint.outputs['validation-json'] }}
      run: |
        python3 "$GITHUB_ACTION_PATH/flux_schema_validate.py" \
          --manifest "$MANIFEST_PATH" \
          --pr-number "$PR_NUMBER" \
          --repo "$REPOSITORY"
