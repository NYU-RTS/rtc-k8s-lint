---
name: RTC Kubernetes Lint
description: >-
  Validate K8s manifests with Flux schema, optionally rendering them with
  Kustomize.
author: NYU RTS

# Define your inputs here.
inputs:
  location:
    description: >-
      Path to the manifests or Kustomize root, relative to the repository root
    required: true
  kustomize:
    description: >-
      Whether to render the manifests with Kustomize before validation
    required: false
    default: 'true'
  github-token:
    description: >-
      Token used to authenticate git operations for private remote Kustomize
      bases via the GitHub CLI credential helper. Defaults to the workflow's
      GITHUB_TOKEN; pass a fine-grained PAT or GitHub App token if private
      remote bases on github.com live outside the current repo's access.
    required: false
    default: ${{ github.token }}
  comment:
    description: >-
      Whether to refresh the PR validation comment from this job, which needs
      pull-requests: write. Set to 'false' to only write a report (see the
      report-path output) and post it from a trusted workflow_run job with
      the comment sub-action instead.
    required: false
    default: 'true'

# Define your outputs here.
outputs:
  manifest:
    description: The manifest passed to Flux schema validation
    value: ${{ steps.lint.outputs.manifest }}
  validation-json:
    description: The Flux schema validation result in JSON format
    value: ${{ steps.lint.outputs['validation-json'] }}
  report-path:
    description: >-
      Path to the validation report written for the comment sub-action. Set on
      pull_request and pull_request_target events.
    value: ${{ steps.report.outputs['report-path'] }}

# Update the image repository and tag below.
runs:
  using: "composite"
  steps:
    - name: lint
      id: lint
      uses: docker://ghcr.io/nyu-rts/rtc-k8s-lint:v0.23.0
      env:
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_KUSTOMIZE: ${{ inputs.kustomize }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - name: Refresh PR validation comment
      id: report
      if: >-
        github.event_name == 'pull_request' ||
        github.event_name == 'pull_request_target'
      shell: bash
      env:
        COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.comment == 'true' && github.token || '' }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        MANIFEST_PATH: ${{ inputs.location }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        VALIDATION_JSON: ${{ steps.lint.outputs['validation-json'] }}
      run: |
        # One file per location so multiple calls in a job can share a
        # directory.
        report_name="$(printf '%s' "$MANIFEST_PATH" | sha256sum | cut -c1-16)"
        report_path="$RUNNER_TEMP/rtc-k8s-lint/$report_name.json"
        echo "report-path=$report_path" >> "$GITHUB_OUTPUT"
        python3 "$GITHUB_ACTION_PATH/flux_schema_validate.py" \
          --manifest "$MANIFEST_PATH" \
          --pr-number "$PR_NUMBER" \
          --repo "$REPOSITORY" \
          --comment "$COMMENT" \
          --report-out "$report_path"
